name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          echo "Checking that index.html exists..."
          test -f index.html && echo "index.html found." || (echo "index.html not found!" && exit 1)
